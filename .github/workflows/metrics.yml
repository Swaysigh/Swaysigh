name: Metrics
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg

          # Header & high-level info
          base: header, metadata, community

          # Introduction / About section (pulls bio from your GitHub account)
          plugin_introduction: yes
          plugin_introduction_title: yes

          # Detailed Languages Breakdown
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_indepth: no
          plugin_languages_other: yes

          # Featured / Pinned Repositories
          plugin_repositories: yes
          plugin_repositories_pinned: 4

          # Starred Topics (displays topics you have starred on GitHub)
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 15

          # Commit Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Recent Activity
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 30
          plugin_activity_filter: push, issue, pr, star

          # Fortune plugin
          plugin_fortune: yes
